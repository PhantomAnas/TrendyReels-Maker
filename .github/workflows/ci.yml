name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: ffmpeg -version
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -v --timeout=180
      - name: Import smoke test (GUI module loads off-screen)
        shell: bash
        run: QT_QPA_PLATFORM=offscreen python -c "import trendyreels.app.main_window"
        if: runner.os == 'Windows'
