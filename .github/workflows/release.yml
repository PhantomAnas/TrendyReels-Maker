name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          github-token: ${{ github.token }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: pyinstaller trendyreels.spec
      - name: Smoke-run the exe (CLI render with the silent voice)
        shell: pwsh
        run: |
          # A windowed exe detaches from the console, so wait on the process explicitly.
          $p = Start-Process -FilePath (Resolve-Path dist\TrendyReelsMaker.exe) -ArgumentList '--cli --no-saved-settings --provider silent --title "Smoke test" --text "One two three four five six seven eight." --out out_test --size 180x320 --fps 10' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "exe smoke test failed with exit code $($p.ExitCode)" }
          $mp4 = Get-ChildItem out_test -Filter *.mp4
          if (-not $mp4) { throw "exe produced no video" }
          $mp4
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/TrendyReelsMaker.exe
          generate_release_notes: true
