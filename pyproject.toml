[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trendyreels-maker"
version = "0.1.0"
description = "Turn a story into a captioned vertical short: AI voice, word-synced pop captions, a title card and your own background footage."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Anas (PhantomAnas)" }]
keywords = ["shorts", "reels", "tiktok", "captions", "tts", "ffmpeg", "pyside6"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "PySide6-Essentials>=6.6",
    "numpy>=1.24",
    "Pillow>=10.1",
    "platformdirs>=3",
    "edge-tts>=7",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0"]
dev = ["pytest>=8", "pytest-timeout>=2", "pyinstaller>=6"]

[project.urls]
Homepage = "https://github.com/PhantomAnas/TrendyReels-Maker"
Issues = "https://github.com/PhantomAnas/TrendyReels-Maker/issues"

[project.scripts]
trendyreels = "trendyreels.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trendyreels = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
